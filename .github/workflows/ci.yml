name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout apcore-a2a spec repo (conformance fixtures)
        uses: actions/checkout@v4
        with:
          repository: aiperceivable/apcore-a2a
          path: .apcore-a2a-spec

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm@10.30.1

      - name: Install dependencies
        run: pnpm install

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
        env:
          # Conformance runners (tests/conformance/) load shared fixtures from the
          # spec repo checked out above; they skip if it is absent.
          APCORE_A2A_SPEC_REPO: ${{ github.workspace }}/.apcore-a2a-spec
